<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>" />
    <title>Caesar Cipher</title>
  </head>
  <body>
    <header>
      <h1>Caesar Cipher</h1>
      <p>Encrypt, decrypt, visualize, and break the classic shift cipher.</p>
    </header>

    <main>
      <!-- Owner: Person B (src/ui/encryptDecrypt.ts) -->
      <section id="encrypt" class="card">
        <h2>1. Encryption</h2>
        <label for="enc-input">Plaintext</label>
        <textarea id="enc-input" rows="3" placeholder="e.g. CRYPTOGRAPHY"></textarea>
        <label for="enc-key">Key (0–25)</label>
        <input id="enc-key" type="text" inputmode="numeric" placeholder="e.g. 4" />
        <button id="enc-btn" type="button">Encrypt</button>
        <div id="enc-error" class="error" hidden></div>
        <div id="enc-output" class="result" hidden></div>
      </section>

      <!-- Owner: Person B (src/ui/encryptDecrypt.ts) -->
      <section id="decrypt" class="card">
        <h2>2. Decryption</h2>
        <label for="dec-input">Ciphertext</label>
        <textarea id="dec-input" rows="3" placeholder="e.g. GVCTXSKVETLC"></textarea>
        <label for="dec-key">Key (0–25)</label>
        <input id="dec-key" type="text" inputmode="numeric" placeholder="e.g. 4" />
        <button id="dec-btn" type="button">Decrypt</button>
        <div id="dec-error" class="error" hidden></div>
        <div id="dec-output" class="result" hidden></div>
      </section>

      <!-- Owner: Person B (src/ui/visualization.ts) -->
      <section id="visualization" class="card">
        <h2>3. How It Works</h2>
        <p id="viz-empty" class="hint">Encrypt or decrypt something above to see each step.</p>
        <div id="viz-alphabet"></div>
        <div id="viz-steps"></div>
      </section>

      <!-- Owner: Person A (src/ui/bruteForce.ts) -->
      <section id="brute-force" class="card">
        <h2>4. Attack: Brute Force</h2>
        <label for="bf-input">Ciphertext</label>
        <textarea id="bf-input" rows="3" placeholder="e.g. GVCTXSKVETLC"></textarea>
        <button id="bf-btn" type="button">Try All Keys</button>
        <div id="bf-error" class="error" hidden></div>
        <div id="bf-results"></div>
      </section>

      <!-- Owner: Person A (src/ui/testRunner.ts) -->
      <section id="test-cases" class="card">
        <h2>5. Test Cases</h2>
        <button id="tests-btn" type="button">Run Tests</button>
        <p id="tests-summary"></p>
        <div id="tests-results"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
